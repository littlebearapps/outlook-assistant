# Publish to npm and MCP Registry
#
# Publishes the package to npm and the Official MCP Registry when a version
# tag is pushed. Uses npm Trusted Publishing (OIDC) for npm auth and GitHub
# OIDC for MCP Registry — no stored secrets required.
#
# Triggers:
# 1. Tag push (manual): git push origin v3.4.1
# 2. workflow_dispatch (from auto-tag.yml): gh workflow run publish.yml --ref v3.4.1
#    GitHub exempts workflow_dispatch from the GITHUB_TOKEN trigger restriction,
#    so auto-tag can chain into publish without needing a PAT.
#
# Prerequisites:
# 1. npm Trusted Publisher configured at
#    https://www.npmjs.com/package/@littlebearapps/outlook-assistant/access
#    (Settings → Trusted Publisher → GitHub Actions:
#     org=littlebearapps, repo=outlook-assistant, workflow=publish.yml,
#     allowed actions: publish)
# 2. server.json with mcpName matching io.github.littlebearapps/outlook-assistant
# 3. Node >= 22.14.0 and npm >= 11.5.1 (required for OIDC trusted publishing)
#
# npm auth: OIDC short-lived token. Bypasses the package's 2FA-required
# policy by design — the OIDC token is its own auth mechanism, not a
# token+OTP combo. Provenance attestation is automatic.
#
# MCP Registry auth: Uses GitHub Actions OIDC (no secrets needed).
# The mcp-publisher CLI exchanges the workflow's OIDC token for a registry JWT.
# Server name must match the publishing repo's GitHub owner (littlebearapps).
#
# Prereleases (a version such as 3.15.0-rc.1, per scripts/release-check.js)
# publish to npm under the `next` dist-tag and skip the MCP Registry.
#
# Note: This workflow uses no untrusted input in run commands.

name: Publish to npm and MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # Required for npm provenance + MCP Registry OIDC
  contents: read

jobs:
  publish:
    name: Publish to npm and MCP Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 22 ships with npm 10.x via the setup-node tool cache.
          # Trusted Publishing requires npm >= 11.5.1, so we upgrade npm
          # explicitly in the next step.
          node-version: '22'
          # No dependency cache in a publish job: setup-node's docs advise
          # against it (a poisoned cache would reach the published package).
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing
        # Node 22.22.3 bundles npm 10.9.8; OIDC Trusted Publishing needs
        # npm >= 11.5.1. Pinned to the 11.x major for deterministic builds.
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/release-check.js prerelease "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        id: npm-publish
        continue-on-error: true
        # Under Trusted Publishing the short-lived OIDC token is minted from
        # `permissions: id-token: write` on this job — no NODE_AUTH_TOKEN
        # needed. `--provenance` is implied; passing it explicitly is fine
        # but redundant. A prerelease goes to the `next` dist-tag so `latest`
        # (what `npx @littlebearapps/outlook-assistant` installs) never moves
        # to it (#319).
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Verify npm publication
        env:
          EXPECTED: ${{ steps.meta.outputs.version }}
          OUTCOME: ${{ steps.npm-publish.outcome }}
        run: |
          # Ask for this exact version: `npm view <pkg> version` reports
          # `latest`, which a prerelease never becomes.
          if [ "$OUTCOME" = "failure" ]; then
            sleep 5
            PUBLISHED=$(npm view "@littlebearapps/outlook-assistant@$EXPECTED" version 2>/dev/null || echo "none")
            if [ "$PUBLISHED" = "$EXPECTED" ]; then
              echo "Version $EXPECTED already on npm — continuing"
            else
              echo "::error::npm publish failed and version $EXPECTED is not on npm (found: $PUBLISHED)"
              exit 1
            fi
          else
            sleep 10
            npm view "@littlebearapps/outlook-assistant@$EXPECTED" version
          fi

      - name: Install mcp-publisher
        # Prereleases stay out of the MCP Registry.
        if: steps.meta.outputs.prerelease != 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        if: steps.meta.outputs.prerelease != 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "Published to MCP Registry"

# Publish to npm and MCP Registry
#
# Publishes the package to npm and the Official MCP Registry when a version
# tag is pushed. Uses npm Trusted Publishing (OIDC) for npm auth and GitHub
# OIDC for MCP Registry — no stored secrets required.
#
# Triggers:
# 1. Tag push (manual): git push origin v3.4.1
# 2. workflow_dispatch (from auto-tag.yml): gh workflow run publish.yml --ref v3.4.1
#    GitHub exempts workflow_dispatch from the GITHUB_TOKEN trigger restriction,
#    so auto-tag can chain into publish without needing a PAT.
#
# Prerequisites:
# 1. npm Trusted Publisher configured at
#    https://www.npmjs.com/package/@littlebearapps/outlook-assistant/access
#    (Settings → Trusted Publisher → GitHub Actions:
#     org=littlebearapps, repo=outlook-assistant, workflow=publish.yml,
#     allowed actions: publish)
# 2. server.json with mcpName matching io.github.littlebearapps/outlook-assistant
# 3. Node >= 22.14.0 and npm >= 11.5.1 (required for OIDC trusted publishing)
#
# npm auth: OIDC short-lived token. Bypasses the package's 2FA-required
# policy by design — the OIDC token is its own auth mechanism, not a
# token+OTP combo. Provenance attestation is automatic.
#
# MCP Registry auth: Uses GitHub Actions OIDC (no secrets needed).
# The mcp-publisher CLI exchanges the workflow's OIDC token for a registry JWT.
# Server name must match the publishing repo's GitHub owner (littlebearapps).
#
# Note: This workflow uses no untrusted input in run commands.

name: Publish to npm and MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # Required for npm provenance + MCP Registry OIDC
  contents: read

jobs:
  publish:
    name: Publish to npm and MCP Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # Node 22 ships with npm 10.x via the setup-node tool cache.
          # Trusted Publishing requires npm >= 11.5.1, so we upgrade npm
          # explicitly in the next step.
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC Trusted Publishing
        # Node 22.22.3 bundles npm 10.9.8; OIDC Trusted Publishing needs
        # npm >= 11.5.1. Pinned to the 11.x major for deterministic builds.
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Publish to npm
        id: npm-publish
        continue-on-error: true
        # Under Trusted Publishing the short-lived OIDC token is minted from
        # `permissions: id-token: write` on this job — no NODE_AUTH_TOKEN
        # needed. `--provenance` is implied; passing it explicitly is fine
        # but redundant.
        run: npm publish --access public

      - name: Verify npm publication
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          if [ "${{ steps.npm-publish.outcome }}" = "failure" ]; then
            sleep 5
            PUBLISHED=$(npm view @littlebearapps/outlook-assistant version 2>/dev/null || echo "none")
            if [ "$PUBLISHED" = "$EXPECTED" ]; then
              echo "Version $EXPECTED already on npm — continuing to MCP Registry"
            else
              echo "::error::npm publish failed and version $EXPECTED is not on npm (found: $PUBLISHED)"
              exit 1
            fi
          else
            sleep 10
            npm view @littlebearapps/outlook-assistant version
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "Published to MCP Registry"

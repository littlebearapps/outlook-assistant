# Publish to npm and MCP Registry
#
# Publishes the package to npm and the Official MCP Registry when a version
# tag is pushed. Uses NPM_TOKEN for npm auth and GitHub OIDC for MCP Registry.
#
# Triggers:
# 1. Tag push (manual): git push origin v3.4.1
# 2. workflow_dispatch (from auto-tag.yml): gh workflow run publish.yml --ref v3.4.1
#    GitHub exempts workflow_dispatch from the GITHUB_TOKEN trigger restriction,
#    so auto-tag can chain into publish without needing a PAT.
#
# Prerequisites:
# 1. Set NPM_TOKEN as a GitHub Actions secret (granular access token from npmjs.com)
# 2. server.json with mcpName matching io.github.littlebearapps/outlook-assistant
#
# MCP Registry auth: Uses GitHub Actions OIDC (no secrets needed).
# The mcp-publisher CLI exchanges the workflow's OIDC token for a registry JWT.
# Server name must match the publishing repo's GitHub owner (littlebearapps).
#
# Future: migrate npm to OIDC trusted publishing when npmjs.com trusted publisher
# is configured (org=littlebearapps, repo=outlook-assistant, workflow=publish.yml)
# and Node 24+ (npm 11.5.1+) is used.
#
# Note: This workflow uses no untrusted input in run commands.

name: Publish to npm and MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # Required for npm provenance + MCP Registry OIDC
  contents: read

jobs:
  publish:
    name: Publish to npm and MCP Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Publish to npm
        id: npm-publish
        continue-on-error: true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm publication
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          if [ "${{ steps.npm-publish.outcome }}" = "failure" ]; then
            sleep 5
            PUBLISHED=$(npm view @littlebearapps/outlook-assistant version 2>/dev/null || echo "none")
            if [ "$PUBLISHED" = "$EXPECTED" ]; then
              echo "Version $EXPECTED already on npm — continuing to MCP Registry"
            else
              echo "::error::npm publish failed and version $EXPECTED is not on npm (found: $PUBLISHED)"
              exit 1
            fi
          else
            sleep 10
            npm view @littlebearapps/outlook-assistant version
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "Published to MCP Registry"

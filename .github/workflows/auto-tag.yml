# Auto-tag and release on version bump
#
# When a push to main changes the version in package.json,
# automatically creates a git tag (e.g. v3.4.0) and GitHub Release,
# then triggers the publish.yml workflow via workflow_dispatch.
#
# Note: Tag pushes from GITHUB_TOKEN don't trigger downstream workflows
# (GitHub's infinite loop prevention). We work around this by using
# workflow_dispatch, which IS exempt from that restriction.
#
# Full release chain:
#   version bump on main → auto-tag → GitHub Release → publish.yml
#   → npm publish + MCP Registry publish (via OIDC)
#
# A prerelease version (e.g. 3.15.0-rc.1) is tagged and released as a GitHub
# prerelease, published to npm under the `next` dist-tag, and skips the MCP
# Registry and the website notification. A push that lowers the version
# (e.g. a force push back to an older commit) is not tagged.
#
# This eliminates the manual steps of running:
#   git tag v3.4.0 && git push origin v3.4.0 && gh release create v3.4.0

name: Auto-tag and release on version bump

on:
  push:
    branches: [main]
    paths: ['package.json']

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    name: Create version tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")

          # package.json version at a commit, or "" if it can't be read.
          version_at() {
            git show "$1:package.json" 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version||"")}catch{console.log("")}})' \
              || true
          }

          # Compare with main as it was before this push (#319): HEAD~1 saw
          # only the last commit, so a bump earlier in a multi-commit push was
          # never tagged. BEFORE is all zeros on a branch's first push; after a
          # force push it may not be an ancestor of HEAD (fetch it by SHA), or
          # may be gone. In those cases fall back to HEAD~1.
          PREVIOUS=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            echo "Comparing with the pre-push tip $BEFORE"
            PREVIOUS=$(version_at "$BEFORE")
          else
            echo "::warning::Pre-push SHA '$BEFORE' is unusable; comparing with HEAD~1"
            PREVIOUS=$(version_at HEAD~1)
          fi

          # changed=true only when the version went up (a force push back to an
          # older version must not publish it as npm `latest`); prerelease=true
          # for versions such as 3.15.0-rc.1.
          {
            echo "current=$CURRENT"
            echo "previous=$PREVIOUS"
            node scripts/release-check.js compare "$PREVIOUS" "$CURRENT"
          } >> "$GITHUB_OUTPUT"

      - name: Check tag doesn't already exist
        if: steps.version.outputs.changed == 'true'
        id: check-tag
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will create"
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true' && steps.check-tag.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true' && steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.current }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          TAG="v$VERSION"
          if [ "$PRERELEASE" = "true" ]; then
            # A prerelease never becomes the repo's "Latest" release.
            gh release create "$TAG" --generate-notes --title "$TAG" --prerelease
            echo "Created GitHub prerelease: $TAG"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
            echo "Created GitHub Release: $TAG"
          fi

      - name: Trigger publish (npm + MCP Registry)
        if: steps.version.outputs.changed == 'true' && steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          gh workflow run publish.yml --ref "$TAG"
          echo "Triggered publish workflow for $TAG"

      - name: Trigger website notification
        # Releases created by GITHUB_TOKEN don't fire the `release: published`
        # event (infinite-loop prevention), so notify-website.yml needs to be
        # dispatched explicitly. Same workaround pattern as the publish step
        # above. workflow_dispatch IS exempt from the GITHUB_TOKEN trigger
        # restriction, so this works without a PAT.
        # Prereleases aren't announced: the site shows the latest release.
        if: steps.version.outputs.changed == 'true' && steps.check-tag.outputs.exists == 'false' && steps.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.current }}"
          gh workflow run notify-website.yml --ref main -f tag="$TAG"
          echo "Triggered notify-website workflow for $TAG"
